name: "Push to main branch"

on:
    push:
        branches:
            - "main"
    workflow_dispatch:

jobs:
    build:
        runs-on: "ubuntu-latest"

        steps:
          - name: "Checkout"
            uses: "actions/checkout@v6"

          - name: "Set version in composer.json"
            run: |
                VERSION="dev-$(git rev-parse --short HEAD)"
                jq --arg ver "$VERSION" '.version = $ver' composer.json > composer.tmp.json
                mv composer.tmp.json composer.json

          - name: "Update metadata in composer.lock"
            run: |
                composer update --lock --ignore-platform-reqs --no-install --no-interaction

          - name: "Login to GitHub Container Registry"
            uses: "docker/login-action@v4"
            with:
                registry: "ghcr.io"
                username: "${{ github.actor }}"
                password: "${{ secrets.GITHUB_TOKEN }}"

          - name: "Get lowercase repository details"
            id: "lowercase-repo-details"
            run: |
                echo "REPOSITORYLC=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

          - name: "Docker Buildx setup"
            uses: "docker/setup-buildx-action@v4"

          - name: "Build and push development image"
            uses: "docker/build-push-action@v7"
            with:
                context: "."
                push: "true"
                tags: |
                    ghcr.io/${{ env.REPOSITORYLC }}:dev-latest
                    ghcr.io/${{ env.REPOSITORYLC }}:dev-${{ github.sha }}
                cache-from: "type=gha"
                cache-to: "type=gha,mode=max"

    test:
        runs-on: "ubuntu-latest"

        needs: ["build"]

        steps:
          - name: "Checkout"
            uses: "actions/checkout@v6"

          - name: "Validate composer.json and composer.lock"
            run: |
                composer validate --strict --no-check-version

          - name: "Cache composer packages"
            id: "composer-cache"
            uses: "actions/cache@v5"
            with:
                path: "vendor"
                key: "${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}"
                restore-keys: |
                    ${{ runner.os }}-php-

          - name: "Install composer packages"
            run: |
                composer install --no-interaction --ignore-platform-reqs

          - name: "Generate testing config"
            run: |
                php config/generate-testing-config.php
                echo "127.0.0.1 database" | sudo tee -a /etc/hosts

          - name: "Docker Buildx setup (for test image)"
            uses: "docker/setup-buildx-action@v4"

          - name: "Build test image"
            uses: "docker/build-push-action@v7"
            with:
              context: "."
              push: "false"
              load: "true"
              tags: |
                  struktaltest:latest
              cache-from: "type=gha,scope=test"
              cache-to: "type=gha,scope=test,mode=max"
              build-args: |
                  BUILDKIT_INLINE_CACHE=1

          - name: "Run tests"
            run: |
                composer run test

          - name: "Dump app logs on failure"
            if: failure()
            run: |
              docker compose -f docker-compose-test.yml logs app
